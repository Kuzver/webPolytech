<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>CSS Playground</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#form">Form</a></li>
                <li><a href="#demo">Demo</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
           <section id="cards" class="cards-section">
            <div class="card-container">
                <div class="card">
                    <img src="background.png" alt="placeholder" class="card-img">
                     <h3>Card 1</h3>
                   <p>Description 1</p>
                </div>
               <div class="card">
                    <img src="background.png" alt="placeholder" class="card-img">
                    <h3>Card 2</h3>
                   <p>Description 2</p>
                 </div>
                 <div class="card">
                  <div class="card-content">
                  <img src="background.png" alt="placeholder" class="card-img">
                    <h3>Card 3</h3>
                    <div class="loader"></div>
                      <p>Description 3</p>
                  </div>
                </div>
            </div>
        </section>
        </section>

        <section id="form">
             <h2>Form Section</h2>
            <div class="form-container">
                <form>
                    <fieldset>
                        <legend>Personal Information</legend>
                        <div class="form-group">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" placeholder="Your full name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" placeholder="your@email.com" required>
                        </div>
                     </fieldset>
                     <fieldset>
                        <legend>Message</legend>
                       <div class="form-group">
                         <label for="message">Message:</label>
                           <textarea id="message" name="message" placeholder="Your message" required></textarea>
                         </div>
                     </fieldset>
                   <div class="form-actions">
                       <button type="submit" class="submit-button">
                           <span class="button-text">Send Message</span>
                           <span class="icon">&#10148;</span>
                       </button>
                       <button type="reset" class="reset-button">
                           <span class="button-text">Reset</span>
                            <span class="icon">&#8634;</span>
                       </button>
                    </div>
                </form>
            </div>
        </section>

         <section id="demo">
            <h2>Demo Section</h2>
             <div class="demo-section">
                <h3>Gradients</h3>
                 <div class="gradient-container">
                  <div class="gradient linear">Linear</div>
                  <div class="gradient radial">Radial</div>
                    <div class="gradient conic">Conic</div>
                 </div>
             </div>
            <div class="demo-section">
                <h3>Transforms 2D</h3>
                <div class="transform-container">
                   <div class="transform rotate">Поворот</div>
                  <div class="transform scale">Увеличение</div>
                </div>
            </div>
             <div class="demo-section">
               <h3>Transforms 3D</h3>
              <div class="transform-container">
                    <div class="transform rotate3d">Расширение</div>
                    <div class="transform translate3d">Увелисение</div>
              </div>
           </div>
            <div class="demo-section">
                <h3>Transitions</h3>
                 <div class="transition-container">
                   <div class="transition transition-scale">Увеличение</div>
                   <div class="transition transition-rotate">Поворот</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
    </footer>
</body>
</html>
